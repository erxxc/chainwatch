name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # The LLM analyzer runs in stub mode for any key starting with "sk-ant-test",
      # so CI never spends real API budget. Individual tests set their own keys;
      # this is a belt-and-suspenders default so Settings never fails to construct.
      ANTHROPIC_API_KEY: sk-ant-test-ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src/ tests/

      - name: Mypy (type check)
        run: mypy src/

      - name: Pytest (with coverage gate)
        run: pytest
