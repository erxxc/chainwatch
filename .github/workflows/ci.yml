name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the checkout. Nothing here
# writes to the repo, publishes, or needs the default write token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      # The LLM analyzer runs in stub mode for any key starting with "sk-ant-test",
      # so CI never spends real API budget. Individual tests set their own keys;
      # this is a belt-and-suspenders default so Settings never fails to construct.
      ANTHROPIC_API_KEY: sk-ant-test-ci
    steps:
      # Actions are pinned to commit SHAs, not mutable tags: a tag can be moved
      # to point at different code, a SHA cannot. Dependabot (github-actions
      # ecosystem in .github/dependabot.yml) keeps the SHA and the version
      # comment in step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src/ tests/

      - name: Mypy (type check)
        run: mypy src/

      - name: Pytest (with coverage gate)
        run: pytest
